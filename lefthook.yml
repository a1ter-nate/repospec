pre-commit:
  parallel: true
  commands:
    oxlint:
      run: bun run lint:oxlint
    no-comments:
      run: bun run lint:no-comments
    state-machines:
      run: bun run lint:state-machines
    diff-cheats:
      run: bun run lint:diff-cheats

pre-push:
  commands:
    verify:
      run: bun run check
