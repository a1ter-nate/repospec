pre-commit:
  parallel: true
  commands:
    oxlint:
      run: bun run lint:oxlint
    privacy:
      run: bun run lint:privacy
    ts-only:
      run: bun run lint:ts-only
    no-comments:
      run: bun run lint:no-comments
    state-machines:
      run: bun run lint:state-machines
    laws:
      run: bun run lint:laws
    diff-cheats:
      run: bun run lint:diff-cheats

pre-push:
  commands:
    verify:
      run: bun run check
