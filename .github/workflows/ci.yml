name: RepoSpec CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --coverage
      - run: bun test ./packages/
      - run: bunx vstack canary . --test-cmd "bun test --timeout 30000 ./tests/taxonomy.table.test.ts ./tests/canonicalize-and-sdk.test.ts ./packages/core/tests/ ./packages/plugin/tests/" --targets packages/core/src/state.ts,packages/plugin/src/specUtils.ts,packages/plugin/src/taxonomy/paths.ts --max-mutants 6 --min-kill-rate 0.75 --fail
      - run: bunx vstack run-rung all .
      - run: bun tools/synthetic-check.ts
      - run: bun run check:vstack
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          bunx vstack diff-cheats . --base "origin/$BASE_REF" --fail
